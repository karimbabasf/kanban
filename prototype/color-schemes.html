<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanban color schemes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@500&display=swap">
<style>
/* Harness: the app fills the window above an 84px strip that holds the picker. */
html, body { height: 100%; margin: 0; overflow: clip; }
body { background: #808080; }
#stage { position: fixed; inset: 0 0 84px 0; overflow: hidden; }

/* App styles, copied from src/styles.css. Tokens come inline from schemes.json on .app. */
.app {
  --side-w: 236px;
  --insp-w: 360px;
  font-family: "Google Sans Flex", -apple-system, "Helvetica Neue", sans-serif;
  /* One face, one weight, one style, everywhere. Hierarchy comes from size and color. */
  font-weight: 500;
  font-style: normal;
  font-optical-sizing: none;
  letter-spacing: normal;
  font-size: 14px;
  line-height: 1.4;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-weight: inherit; font-style: inherit; }
.app { user-select: none; -webkit-user-select: none; cursor: default; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: default; }
input, textarea { font: inherit; color: inherit; background: none; border: 0; outline: none; resize: none; caret-color: var(--blue); }
input, textarea, .insp { user-select: text; -webkit-user-select: text; }
::selection { background: var(--blue-wash); color: var(--ink); }
::placeholder { color: var(--muted); opacity: 1; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
input:focus-visible, textarea:focus-visible { outline: none; }
input[type="range"]:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; border-radius: 10px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--paper-deep); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

kbd, .keys .to { font: inherit; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.keys { display: inline-flex; gap: 2px; align-items: center; vertical-align: 1px; }
kbd svg { display: block; }
kbd { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 5px; background: var(--paper-down); color: var(--ink-2); }
.keys .to { color: var(--muted); padding: 0 1px; }

/* Shell */
.app {
  --fs-card: calc(12.5px + 3px * var(--d));
  --pad-card: calc(9px + 7px * var(--d));
  --gap: calc(5px + 5px * var(--d));
  --lane-min: calc(216px + 96px * var(--d));
  --count: calc(30px + 14px * var(--d));
  height: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; background: var(--paper); }
.pane { overflow: hidden; height: 100%; }
.side-pane { width: var(--side-w); }
.insp-pane { width: var(--insp-w); }
.side-pane .side { width: var(--side-w); }
.insp-pane .insp { width: var(--insp-w); }

.side { height: 100%; background: var(--paper-down); padding: 0 10px 14px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
.side-top { position: relative; height: 50px; flex: none; margin: 0 -10px; }
.lights { position: absolute; left: 20px; top: 19px; display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; }
.lights i:nth-child(1) { background: #ff5f57; }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.side-h { font-size: 12.5px; color: var(--muted); padding: 0 10px 6px; }
.side-row { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 10px; text-align: left; color: var(--ink-2); transition: background-color 0.15s; }
.side-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-row .n { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.side-row:hover { background: var(--paper-deep); }
.side-row.on { background: var(--paper-up); color: var(--ink); }
.side-row.here { color: var(--ink); }
.side-row.add { color: var(--muted); }
.side-row.add:hover { color: var(--ink-2); }

.main { container-type: inline-size; min-width: 0; height: 100%; display: grid; grid-template-rows: 64px minmax(0, 1fr) 44px; }
.toolbar { display: flex; align-items: center; gap: 16px; padding: 0 18px 0 20px; min-width: 0; }
.board-name { flex: 1 1 auto; font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.density { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.density .readout { font-variant-numeric: tabular-nums; min-width: 4em; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 112px; height: 18px; background: transparent; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: var(--paper-deep); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--ink); box-shadow: var(--shadow-knob); }

.search { display: flex; align-items: center; gap: 8px; width: 210px; flex: none; height: 36px; padding: 0 10px 0 12px; border-radius: 10px; background: var(--paper-down); }
.search:focus-within { background: var(--paper-deep); }
.search input { flex: 1; min-width: 0; height: 100%; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 10px; background: var(--ink); color: var(--paper); white-space: nowrap; transition: transform 0.12s, background-color 0.15s; }
.btn kbd { background: var(--on-ink); color: var(--paper); }
.btn:hover { background: var(--ink-hover); }
.btn:active { transform: scale(0.97); }
.btn.quiet { background: transparent; color: var(--muted); padding: 0 8px; }
.btn.quiet kbd { background: var(--paper-down); color: var(--muted); }
.btn.quiet:hover { background: var(--paper-down); color: var(--red); }

/* Board */
.board { min-height: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(var(--lane-min), 1fr); gap: 12px; padding: 2px 18px 0; overflow-x: auto; overflow-y: hidden; }
.lane { min-height: 0; display: flex; flex-direction: column; background: var(--paper-down); border-radius: 20px; padding: 8px; }
.lane-head { padding: 6px 8px 12px; }
.count { display: block; height: var(--count); overflow: hidden; font-size: var(--count); line-height: 1; font-variant-numeric: tabular-nums; }
.count > span { display: inline-block; }
.lane-name { display: block; font-size: 14px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

.cards { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: var(--gap); padding: 4px; margin: -4px; }
.card { position: relative; flex: none; background: var(--paper-up); border-radius: 12px; padding: var(--pad-card); font-size: var(--fs-card); }
.card.stock-sun { background: var(--stock-sun); }
.card.stock-sky { background: var(--stock-sky); }
.card.stock-sage { background: var(--stock-sage); }
.card.stock-clay { background: var(--stock-clay); }
.card.stock-lilac { background: var(--stock-lilac); }
.card .title { line-height: 1.32; overflow-wrap: anywhere; }
.card .due { margin-top: 8px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .due.late { color: var(--red); }
.ring { position: absolute; inset: -3px; border-radius: 15px; box-shadow: 0 0 0 2px var(--blue); pointer-events: none; }

.add-card { position: relative; flex: none; display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 10px; border-radius: 12px; color: var(--muted); font-size: 12.5px; transition: background-color 0.15s, color 0.15s; }
.add-card:hover { background: var(--paper-deep); color: var(--ink-2); }

.hints { display: flex; align-items: center; gap: 18px; padding: 0 20px; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.hints > span { display: inline-flex; align-items: center; gap: 5px; }

/* Inspector */
.insp { height: 100%; background: var(--paper-up); padding: 0 20px 18px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.insp-top { height: 32px; flex: none; margin: 0 -20px; }
.insp-title { display: block; width: 100%; font-size: 22px; line-height: 1.2; overflow: hidden; text-wrap: balance; padding-top: 6px; }
.field { display: block; width: 100%; background: var(--paper); border-radius: 12px; padding: 11px 13px; line-height: 1.55; }
.notes { min-height: 96px; overflow: hidden; }
.row { display: flex; gap: 8px; }
.due-field { position: relative; display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 13px; flex: 1; }
.due-field input { flex: 1; min-width: 0; height: 26px; font-variant-numeric: tabular-nums; }
.due-field input::-webkit-calendar-picker-indicator { opacity: 0.55; }
.due-field.empty input:not(:focus)::-webkit-datetime-edit { opacity: 0; }
.no-due { position: absolute; left: 13px; color: var(--muted); pointer-events: none; }
.due-field.empty:focus-within .no-due { display: none; }
.icon { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; color: var(--muted); }
.icon:hover { background: var(--paper-down); color: var(--ink); }
.quick { width: auto; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; white-space: nowrap; transition: background-color 0.15s; }
.quick:hover { background: var(--paper-down); }

.swatches { display: flex; align-items: center; gap: 10px; padding: 4px 2px; }
.swatch { width: 26px; height: 26px; border-radius: 8px; transition: transform 0.15s, box-shadow 0.15s; }
.swatch:hover { transform: scale(1.08); }
.swatch.on { box-shadow: 0 0 0 2px var(--paper-up), 0 0 0 4px var(--ink); }
.ink-sun { background: var(--ink-sun); }
.ink-sky { background: var(--ink-sky); }
.ink-sage { background: var(--ink-sage); }
.ink-clay { background: var(--ink-clay); }
.ink-lilac { background: var(--ink-lilac); }
.swatch-hint { margin-left: auto; }

.seg { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--paper-down); overflow-x: auto; }
.seg button { flex: 1 0 auto; height: 32px; padding: 0 10px; border-radius: 8px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; transition: background-color 0.15s, color 0.15s; }
.seg button:hover { background: var(--paper-deep); }
.seg button.on { background: var(--ink); color: var(--paper); }

.insp-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--muted); padding-top: 8px; font-variant-numeric: tabular-nums; }
.empty-title { font-size: 22px; line-height: 1.2; padding-top: 6px; }
.empty-body { color: var(--muted); line-height: 1.6; }

@container (max-width: 790px) { .density .readout { display: none; } .hints > span:nth-child(n + 7) { display: none; } }
@container (max-width: 680px) { .density { display: none; } .hints > span:nth-child(n + 5) { display: none; } }
@container (max-width: 520px) { .search { width: 150px; } .btn kbd { display: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}

/* Picker: verbatim from the prototype skill's PICKER.md. */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

/* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative; /* sits above the highlight */
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}

.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}

/* Harness exception, outside the verbatim block: with ten variants (the spec plans for five),
   left: 50% caps the pill at half the window and multi-word names wrap. Size it to its content. */
.proto-picker { width: max-content; }
</style>
</head>

// ---- Board data (realistic sample content). Due dates are day offsets from today.
const LANES = {
  builds: ["Backlog", "Next", "Doing", "Done"],
  study: ["Queue", "Rebuild by hand", "Posted"],
  errands: ["To do", "Waiting", "Done"],
};
const BOARDS = [
  { id: "builds", name: "Builds" },
  { id: "study", name: "Study loop" },
  { id: "errands", name: "Errands" },
];
let seq = 0;
const C = (board, lane, title, stock = null, due = null, notes = "", added = -6) => ({ id: "c" + ++seq, board, lane, title, stock, due, notes, added });
const CARDS = [
  C("builds", 0, "Export a board to Markdown"),
  C("builds", 0, "Sync between two Macs, spike first", "lilac"),
  C("builds", 0, "Archive a lane instead of deleting it"),
  C("builds", 0, "Card templates for study loops", "sky", 8),
  C("builds", 0, "Write the 150-word post on the drag engine", "sun", 1),
  C("builds", 1, "Undo history survives a restart", "sage", -2),
  C("builds", 1, "Search across every board", null, 4),
  C("builds", 1, "Auto-update channel for the Tauri build", "clay"),
  C("builds", 2, "Keyboard move between lanes", "sky", 0,
    "Shift with an arrow moves the card one lane over and keeps it selected. The ring follows the card.\n\nUndo puts it back in the same slot. Check it stays under 100 ms with 200 cards on the board.", -4),
  C("builds", 2, "Density slider snaps to tenths", null, -1),
  C("builds", 3, "SQLite write on every change", "sage"),
  C("builds", 3, "Command palette on Cmd K"),
  C("builds", 3, "Lane count rolls when it changes", "lilac"),

  C("study", 1, "Rebuild the undo stack, no AI, 30 min", "clay", 0),
  C("study", 2, "Post: 150 words on drag and drop", "sage"),
  C("study", 2, "Three lines at 20:30"),
  C("errands", 0, "Renew the passport photo", "clay", 3),
  C("errands", 0, "Return the USB-C hub", null, -3),
  C("errands", 1, "Refund from the cafe order", "lilac"),
  C("errands", 2, "Book the dentist", "sage"),
];

const state = { board: "builds", sel: "c9", density: 0.5, q: "" };

// ---- Dates
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayOff = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
for (const c of CARDS) { if (c.due !== null) c.due = dayOff(c.due); c.added = dayOff(c.added); }
const md = new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric" });
const mdy = new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric", year: "numeric" });
const asDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
function dueLabel(due) {
  const t = dayOff(0);
  if (due === t) return { text: "Today", late: false };
  if (due === dayOff(1)) return { text: "Tomorrow", late: false };
  const text = md.format(asDate(due));
  return due < t ? { text: `Overdue, ${text}`, late: true } : { text, late: false };
}

// ---- Icons (Lucide paths, ISC license), drawn so no key glyph falls back to another font.
const PATHS = {
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  "⌘": '<path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/>',
  "⇧": '<path d="M9 18v-6H5l7-7 7 7h-4v6H9z"/>',
  "←": '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  "→": '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  "↑": '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
  "↓": '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',
  "↵": '<polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/>',
  "⌫": '<path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
};
const icon = (k, size, sw, label) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"${label ? ` role="img" aria-label="${label}"` : ' aria-hidden="true"'}>${PATHS[k]}</svg>`;
const keys = (ks) =>
  `<span class="keys">${ks.map((k) => (k === "to" ? '<span class="to">to</span>' : `<kbd>${PATHS[k] ? icon(k, 11, 2.25, k) : k}</kbd>`)).join("")}</span>`;
const esc = (s) => s.replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);

// ---- Render
const STOCKS = ["sun", "sky", "sage", "clay", "lilac"];
const lanesOf = (b) => LANES[b].map((name, i) => ({ i, name, cards: CARDS.filter((c) => c.board === b && c.lane === i) }));
const match = (c) => !state.q.trim() || c.title.toLowerCase().includes(state.q.trim().toLowerCase());
const selected = () => CARDS.find((c) => c.id === state.sel && c.board === state.board) || null;

function render(scheme) {
  const tokens = Object.entries(scheme.tokens).map(([k, v]) => `${k}: ${v}`).join("; ");
  const lanes = lanesOf(state.board);
  const card = selected();
  const size = Math.round((12.5 + 3 * state.density) * 10) / 10;
  const board = BOARDS.find((b) => b.id === state.board);

  const side = `
    <div class="pane side-pane"><aside class="side">
      <div class="side-top"><span class="lights" aria-hidden="true"><i></i><i></i><i></i></span></div>
      <nav aria-label="Boards">
        <h2 class="side-h">Boards</h2>
        ${BOARDS.map((b) => `<button class="side-row${b.id === state.board ? " on" : ""}" data-board="${b.id}"><span class="name">${b.name}</span><span class="n">${CARDS.filter((c) => c.board === b.id).length}</span></button>`).join("")}
        <button class="side-row add" data-act="new-board">${icon("plus", 15, 1.75)}<span class="name">New board</span><span class="n">${keys(["⌘", "N"])}</span></button>
      </nav>
      <nav aria-label="Lanes">
        <h2 class="side-h">Lanes</h2>
        ${lanes.map((l) => `<button class="side-row${card && card.lane === l.i ? " here" : ""}" data-lane-pick="${l.i}"><span class="name">${l.name}</span><span class="n">${l.cards.length}</span></button>`).join("")}
        <button class="side-row add" data-act="new-lane">${icon("plus", 15, 1.75)}<span class="name">New lane</span></button>
      </nav>
    </aside></div>`;

  const toolbar = `
    <header class="toolbar">
      <h1 class="board-name">${esc(board.name)}</h1>
      <label class="density" title="Density: Cmd minus and Cmd equals">
        <input type="range" aria-label="Density" min="0" max="1" step="0.1" value="${state.density}" data-act="density">
        <span class="readout">${size} px</span>
      </label>
      <div class="search">
        <input value="${esc(state.q)}" placeholder="Search cards" aria-label="Search cards" data-act="search">
        ${state.q ? "" : keys(["/"])}
      </div>
      <button class="btn" data-act="new-card">${icon("plus", 15, 2)}New card ${keys(["N"])}</button>
    </header>`;

  const cardEl = (c) => {
    const due = c.due ? dueLabel(c.due) : null;
    return `<article class="card${c.stock ? " stock-" + c.stock : ""}" data-id="${c.id}">${c.id === state.sel ? '<span class="ring"></span>' : ""}<p class="title">${esc(c.title)}</p>${due ? `<p class="due${due.late ? " late" : ""}">${due.text}</p>` : ""}</article>`;
  };
  const boardEl = `
    <div class="board">
      ${lanes.map((l) => {
        const shown = l.cards.filter(match);
        return `<section class="lane" data-lane="${l.i}" aria-label="${l.name}">
          <header class="lane-head"><span class="count" aria-label="${shown.length} cards"><span>${shown.length}</span></span><h3 class="lane-name">${l.name}</h3></header>
          <div class="cards">${shown.map(cardEl).join("")}<button class="add-card" data-add="${l.i}">${icon("plus", 15, 1.75)}Add card</button></div>
        </section>`;
      }).join("")}
    </div>`;

  const hints = `
    <footer class="hints">
      <span>${keys(["⇧", "←", "→"])} lane</span>
      <span>${keys(["⇧", "↑", "↓"])} reorder</span>
      <span>${keys(["↵"])} rename</span>
      <span>${keys(["E"])} notes</span>
      <span>${keys(["⌫"])} delete</span>
      <span>${keys(["⌘", "Z"])} undo</span>
      <span>${keys(["⌘", "K"])} commands</span>
      <span>${keys(["?"])} all keys</span>
    </footer>`;

  const insp = card ? `
    <aside class="insp" aria-label="Card">
      <div class="insp-top"></div>
      <textarea class="insp-title" rows="1" aria-label="Title" data-act="title">${esc(card.title)}</textarea>
      <textarea class="field notes" rows="3" placeholder="Notes" aria-label="Notes" data-act="notes">${esc(card.notes)}</textarea>
      <div class="row">
        <label class="field due-field${card.due ? "" : " empty"}">
          <span class="sr">Due date</span>
          ${card.due ? "" : '<span class="no-due" aria-hidden="true">No due date</span>'}
          <input type="date" value="${card.due ?? ""}" data-act="due">
          ${card.due ? `<button class="icon" data-act="clear-due" aria-label="Clear due date">${icon("x", 15, 1.75)}</button>` : ""}
        </label>
        <button class="field quick" data-act="today">Today ${keys(["T"])}</button>
      </div>
      <div class="swatches" role="radiogroup" aria-label="Color">
        ${STOCKS.map((s, i) => `<button role="radio" aria-checked="${card.stock === s}" aria-label="Color ${i + 1}" class="swatch ink-${s}${card.stock === s ? " on" : ""}" data-stock="${s}"></button>`).join("")}
        <span class="swatch-hint">${keys(["1", "to", "5"])}</span>
      </div>
      <div class="seg" role="radiogroup" aria-label="Lane">
        ${lanes.map((l) => `<button role="radio" aria-checked="${l.i === card.lane}" class="${l.i === card.lane ? "on" : ""}" data-move="${l.i}">${l.name}</button>`).join("")}
      </div>
      <div class="insp-foot">
        <span>Added ${mdy.format(asDate(card.added))}</span>
        <button class="btn quiet" data-act="delete">${icon("trash", 15, 1.75)}Delete ${keys(["⌫"])}</button>
      </div>
    </aside>` : `
    <aside class="insp empty" aria-label="Card">
      <div class="insp-top"></div>
      <p class="empty-title">No card selected</p>
      <p class="empty-body">Press ${keys(["N"])} to add one, or pick a card with the arrows.</p>
    </aside>`;

  return `<div class="app" data-scheme="${esc(scheme.name)}" style="${tokens}; --d: ${state.density}; color-scheme: ${scheme.mode}">
    ${side}
    <main class="main">${toolbar}${boardEl}${hints}</main>
    <div class="pane insp-pane">${insp}</div>

}

const variants = SCHEMES.map((s) => () => render(s));

// ---- Picker wiring: verbatim from PICKER.md.
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));

// ---- Interactions on the board (same behavior in every scheme).
function autosize(el) { el.style.height = "0px"; el.style.height = el.scrollHeight + "px"; }
new MutationObserver(() => stage.querySelectorAll("textarea").forEach(autosize)).observe(stage, { childList: true });
function rerender(focusSel) {
  stage.innerHTML = variants[current]();
  if (focusSel) {
    const el = stage.querySelector(focusSel);
    if (el) { el.focus(); if (el.setSelectionRange && el.value != null) el.setSelectionRange(el.value.length, el.value.length); }
  }
}
function addCard(lane) {
  const c = C(state.board, lane, "New card", null, null, "", 0);
  c.added = dayOff(0);
  CARDS.push(c);
  state.sel = c.id;
  rerender(".insp-title");
  stage.querySelector(".insp-title")?.select();
}
stage.addEventListener("click", (e) => {
  const t = e.target.closest("[data-id], [data-board], [data-lane-pick], [data-stock], [data-move], [data-add], [data-act]");
  if (!t) return;
  const card = selected();
  if (t.dataset.id) { state.sel = t.dataset.id; return rerender(); }
  if (t.dataset.board) {
    state.board = t.dataset.board;
    state.sel = CARDS.find((c) => c.board === state.board)?.id ?? null;
    return rerender();
  }
  if (t.dataset.lanePick) {
    const first = CARDS.find((c) => c.board === state.board && c.lane === +t.dataset.lanePick);
    if (first) { state.sel = first.id; rerender(); }
    return;
  }
  if (t.dataset.stock && card) { card.stock = card.stock === t.dataset.stock ? null : t.dataset.stock; return rerender(); }
  if (t.dataset.move && card) {
    card.lane = +t.dataset.move;
    CARDS.push(CARDS.splice(CARDS.indexOf(card), 1)[0]);
    return rerender();
  }
  if (t.dataset.add) return addCard(+t.dataset.add);
  const act = t.dataset.act;
  if (act === "new-card") return addCard(card ? card.lane : 0);
  if (act === "today" && card) { card.due = dayOff(0); return rerender(); }
  if (act === "clear-due" && card) { e.preventDefault(); card.due = null; return rerender(); }
  if (act === "delete" && card) {
    const lane = card.lane;
    CARDS.splice(CARDS.indexOf(card), 1);
    state.sel = (CARDS.find((c) => c.board === state.board && c.lane === lane) || CARDS.find((c) => c.board === state.board))?.id ?? null;
    return rerender();
  }
});
stage.addEventListener("input", (e) => {
  const t = e.target;
  const card = selected();
  const act = t.dataset.act;
  if (act === "density") {
    state.density = +t.value;
    stage.querySelector(".app").style.setProperty("--d", state.density);
    stage.querySelector(".readout").textContent = Math.round((12.5 + 3 * state.density) * 10) / 10 + " px";
    stage.querySelectorAll("textarea").forEach(autosize);
  } else if (act === "search") {
    state.q = t.value;
    rerender('[data-act="search"]');
  } else if (act === "title" && card) {
    card.title = t.value.replace(/\n/g, " ");
    const el = stage.querySelector(`.card[data-id="${card.id}"] .title`);
    if (el) el.textContent = card.title;
    autosize(t);
  } else if (act === "notes" && card) {
    card.notes = t.value;
    autosize(t);
  }
});
stage.addEventListener("change", (e) => {
  const card = selected();
  if (e.target.dataset.act === "due" && card) { card.due = e.target.value || null; rerender(); }
});
stage.addEventListener("keydown", (e) => {
  if (e.target.dataset.act === "search" && e.key === "Escape") { state.q = ""; rerender(); }
  if (e.target.dataset.act === "title" && e.key === "Enter") { e.preventDefault(); stage.querySelector(".notes")?.focus(); }
});
</script>
</body>
</html>
